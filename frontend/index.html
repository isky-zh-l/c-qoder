<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ff" />
    <meta
      name="description"
      content="个人 C 语言学习笔记与源码整理，按章节阅读。"
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>C 语言学习笔记</title>
    <style>
      .boot-shell {
        min-height: 100vh;
        padding: 26px 22px;
        color: #2f2745;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f7f4ff;
      }
      .boot-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
      }
      .boot-brand span {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border-radius: 9px;
        color: #fff;
        font-weight: 700;
        background: #6f4df0;
      }
      .boot-card {
        max-width: 640px;
        margin: 46px auto 0;
        padding: 20px;
        border: 1px solid #e8e1f6;
        border-radius: 16px;
        background: #fff;
      }
      .boot-title {
        margin: 0 0 6px;
        font-size: 15px;
        font-weight: 650;
      }
      .boot-status {
        margin: 0;
        color: #6c6480;
        font-size: 12.5px;
      }
      .boot-progress {
        height: 5px;
        margin: 14px 0 10px;
        border-radius: 99px;
        overflow: hidden;
        background: #efe9fb;
      }
      .boot-progress i {
        display: block;
        width: 6%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #6f4df0, #b39dff);
        transition: width 0.35s ease;
      }
      .boot-hint {
        margin: 0;
        color: #9a93ab;
        font-size: 11.5px;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-progress i { transition: none; }
      }
    </style>
  </head>
  <body>
    <script>
      (function () {
        var path = window.location.pathname
        if (path === '/' || path === '/index.html') {
          window.location.replace(
            '/c/' + window.location.search + window.location.hash,
          )
        } else if (path === '/c') {
          window.location.replace(
            '/c/' + window.location.search + window.location.hash,
          )
        }
      })()
    </script>
    <div id="app">
      <div class="boot-shell" aria-hidden="true">
        <div class="boot-brand"><span>C</span><strong>C 语言学习笔记</strong></div>
        <div class="boot-card">
          <p class="boot-title">正在加载 C 语言学习笔记</p>
          <p class="boot-status">正在下载界面…</p>
          <div class="boot-progress"><i></i></div>
          <p class="boot-hint">首次加载会慢一点，之后会快很多。</p>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var bar = document.querySelector('.boot-progress i')
        var status = document.querySelector('.boot-status')
        if (!bar) return
        var percent = 6
        var timer = window.setInterval(function () {
          if (!document.querySelector('.boot-shell')) {
            window.clearInterval(timer)
            return
          }
          if (percent < 88) {
            percent = Math.min(88, percent + Math.max(1, (90 - percent) * 0.08))
            bar.style.width = percent + '%'
          }
        }, 260)
        window.__cqBoot = {
          set: function (text, value) {
            if (status && text) status.textContent = text
            if (bar && typeof value === 'number') {
              percent = Math.max(percent, value)
              bar.style.width = percent + '%'
            }
          },
          done: function () {
            if (bar) bar.style.width = '100%'
            window.clearInterval(timer)
          }
        }
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
